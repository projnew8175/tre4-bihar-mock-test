{% extends "base.html" %}{% block content %}<div class="hero small"><h1>{{student.name}}</h1><p>Result History • {{student.roll}}</p></div><div class="card"><table><tr><th>Attempt</th><th>Score</th><th>Correct</th><th>Wrong</th><th>Unattempted</th><th>Date</th></tr>{% for r in results %}<tr><td>{{loop.index}}</td><td><b>{{r.score}}/{{r.total}}</b></td><td>{{r.correct_count}}</td><td>{{r.wrong_count}}</td><td>{{r.unattempted}}</td><td>{{r.created_at}}</td></tr>{% endfor %}</table></div>{% endblock %}
