{% extends "base.html" %}{% block content %}<div class="hero small"><div class="badge">TOP SCORES</div><h1>Leaderboard</h1><p>हर student का best score दिखाया गया है.</p></div><div class="card"><table><tr><th>#</th><th>Student</th><th>Score</th><th>Percentage</th><th>Attempts</th></tr>{% for r in rows %}<tr><td>{{loop.index}}</td><td><b>{{r.student.name}}</b></td><td><strong>{{r.score}}/{{r.total}}</strong></td><td>{{'%.1f'|format(r.score/r.total*100)}}%</td><td><a href="{{url_for('history',student_id=r.student_id)}}">History</a></td></tr>{% endfor %}</table></div>{% endblock %}
